<section class="auth-card card">
  <h1>Create account</h1>
  <p class="subtitle">Join the prediction pool and compete on the leaderboard.</p>

  @if (errorMessage()) {
    <p class="alert alert-error" role="alert">{{ errorMessage() }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Display name
      <input type="text" formControlName="name" autocomplete="name" />
      @if (form.controls.name.touched && form.controls.name.invalid) {
        <span class="field-error">Name is required.</span>
      }
    </label>

    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="field-error">Enter a valid email.</span>
      }
    </label>

    <label>
      Password
      <input type="password" formControlName="password" autocomplete="new-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="field-error">Password is required (min 6 characters).</span>
      }
    </label>

    <button type="submit" class="btn btn-primary" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Creating account…' : 'Register' }}
    </button>
  </form>

  <p class="footer-link">
    Already have an account?
    <a routerLink="/login">Log in</a>
  </p>
</section>
