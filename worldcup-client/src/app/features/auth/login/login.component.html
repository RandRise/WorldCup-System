<section class="auth-card card">
  <h1>Log in</h1>
  <p class="subtitle">Sign in to place bets and track your ranking.</p>

  @if (errorMessage()) {
    <p class="alert alert-error" role="alert">{{ errorMessage() }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="field-error">Enter a valid email.</span>
      }
    </label>

    <label>
      Password
      <input type="password" formControlName="password" autocomplete="current-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="field-error">Password is required (min 6 characters).</span>
      }
    </label>

    <button type="submit" class="btn btn-primary" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <p class="footer-link">
    No account?
    <a routerLink="/register">Create one</a>
  </p>
</section>
