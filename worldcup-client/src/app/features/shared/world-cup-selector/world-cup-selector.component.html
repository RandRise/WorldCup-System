@if (context.worldCups().length > 0) {
  <label class="wc-select">
    <span>Tournament</span>
    <select
      [ngModel]="selectedId()"
      (ngModelChange)="onSelect($event)"
      [attr.aria-label]="'Selected tournament: ' + context.selectedWorldCupLabel()"
    >
      @for (worldCup of context.worldCups(); track worldCup.id) {
        <option [ngValue]="worldCup.id">{{ context.worldCupLabel(worldCup) }}</option>
      }
    </select>
  </label>
}
